name: BudgetBridge CI/CD

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:

  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker Image
        run: |
          docker build -t rafaydevsinc/budgetbridge-server:latest .

      - name: Push Image to DockerHub
        run: |
          docker push rafaydevsinc/budgetbridge-server:latest


  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/budgetbridge.pem
          chmod 600 ~/.ssh/budgetbridge.pem

      - name: Copy docker-compose file to EC2
        run: |
          scp -o StrictHostKeyChecking=no \
          -i ~/.ssh/budgetbridge.pem \
          docker-compose-dev.yaml \
          ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/home/${{ secrets.EC2_USER }}/

      - name: Deploy on EC2
        run: |
          ssh -o StrictHostKeyChecking=no \
          -i ~/.ssh/budgetbridge.pem \
          ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'

          docker pull rafaydevsinc/budgetbridge-server:latest
          docker compose -f docker-compose-dev.yaml up -d
          
          EOF