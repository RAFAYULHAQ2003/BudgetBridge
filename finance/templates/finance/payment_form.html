{% extends "base.html" %}
{% block content %}
<h2>Record Payment for Invoice {{ object.invoice_no }}</h2>
<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit" class="btn btn-primary">Save Payment</button>
  <a href="{% url 'project-payment-invoice-list' %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
