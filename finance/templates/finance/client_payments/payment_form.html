{% extends "base.html" %}
{% block title %}Update Payment{% endblock %}

{% block content %}
<div class="container mt-4">
  <h2>Update Payment for Invoice #{{ form.instance.invoice.invoice_no }}</h2>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-success">Update Payment</button>
    <a href="{% url 'client-payment-dashboard' %}" class="btn btn-secondary">Cancel</a>
  </form>
</div>
{% endblock %}
