{% extends "base.html" %}
{% block content %}
<h2>Create Project Payment Invoice</h2>
<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit" class="btn btn-primary">Create & Send Invoice</button>
  <a href="{% url 'project-payment-invoice-list' %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
