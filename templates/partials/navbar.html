{% load static %}

<header class="topbar" role="banner">


  <button class="topbar-toggle" onclick="toggleSidebar()" aria-label="Toggle navigation">
    ☰
  </button>

  
  <div class="topbar-breadcrumb" style="flex:2; font-weight:900; color:var(--text);">
    {% if request.user.is_authenticated %}
      {{ request.user.company.name|default:"Company"|upper }}
    {% else %}
      Welcome
    {% endif %}
  </div>

 
  <div class="topbar-actions">


    <div class="topbar-divider"></div>

    {% if request.user.is_authenticated %}
<form method="POST" action="{% url 'logout' %}" style="display:inline;">
  {% csrf_token %}
  <button type="submit" class="btn btn-danger d-flex items-center gap-2">
    <span>Sign Out</span>
  </button>
</form>
{% endif %}

  </div>

</header>
